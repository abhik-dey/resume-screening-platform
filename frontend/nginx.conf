# nginx config for the frontend container (serves built static assets).
# The edge proxy in infra/nginx/ sits in front of this.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames change whenever content changes, so they can be
    # cached indefinitely. index.html must NOT be, or users keep loading an
    # old shell that references deleted asset files.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: /jobs/abc-123 is a React route, not a file, so
    # unmatched paths fall through to index.html rather than 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Nothing here reveals server details to a client that has no use for them.
    server_tokens off;
}
