# Edge reverse proxy.
#
# Terminates TLS, routes /api/* to the backend and everything else to the
# static frontend, and blocks the operational endpoints from the outside.

upstream backend {
    server backend:8000;
    keepalive 32;
}

upstream frontend {
    server frontend:8080;
}

# Rate limiting at the edge as well as in the application.
#
# Not redundant: the application limiter (Phase 19) is per-user and
# understands which endpoints are expensive, but it runs *after* request
# parsing and a DB session is opened. An edge limit sheds crude floods
# before they reach Python at all. Two layers, different jobs.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name _;

    # In a real deployment this redirects to HTTPS. Left as a comment
    # rather than enabled because forcing a redirect with no certificate
    # present would make the stack unusable out of the box.
    # return 301 https://$host$request_uri;

    client_max_body_size 12M;  # resume uploads are capped at 10MB
    server_tokens off;

    # Defense in depth: the application sets these too (Phase 19), but the
    # edge is the last place they can be added if an upstream forgets.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    limit_conn conn_limit 20;

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Preserve the correlation ID from Phase 18 across the proxy hop.
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";

        # LLM-backed endpoints legitimately take minutes. The default 60s
        # would sever a screening run mid-flight and return a 504 while the
        # work continued server-side — the worst of both.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;  # stream responses rather than buffering
    }

    # PHASE 18 GAP CLOSED: /metrics was deliberately unauthenticated so
    # Prometheus could scrape it, on the understanding that network policy
    # would restrict access. This is that policy — the endpoint is
    # unreachable from outside, while Prometheus reaches the backend
    # directly on the internal network.
    location /metrics {
        deny all;
        return 404;
    }

    # Swagger UI is genuinely useful in staging and a liability in
    # production: it enumerates every endpoint and schema. Denied here;
    # remove this block for a staging deployment.
    location ~ ^/(docs|redoc|openapi.json) {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
