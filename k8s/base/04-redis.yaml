# Redis as a Deployment, not a StatefulSet.
#
# Deliberate: here Redis is a cache and a rate-limit window store. Losing
# it degrades behavior (rate limits reset) but corrupts nothing, so the
# stable-identity guarantees of a StatefulSet aren't needed. Using one
# anyway would imply a durability requirement that doesn't exist.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: resume-screening
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: resume-screening
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          resources:
            requests: {memory: "64Mi", cpu: "50m"}
            limits: {memory: "256Mi", cpu: "500m"}
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec: {command: ["redis-cli", "ping"]}
            initialDelaySeconds: 15
            periodSeconds: 20
