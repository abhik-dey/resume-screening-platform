# SECRET TEMPLATE — never commit a filled-in copy.
#
# Generate the real Secret with k8s/generate-secrets.sh, which writes to a
# gitignored path. A committed manifest containing a real JWT signing key
# is in the repository history forever, and rotating it doesn't remove it.
#
# For anything beyond a demo, use External Secrets Operator or Sealed
# Secrets rather than raw Secret objects — base64 is encoding, not
# encryption, and anyone with read access to the namespace can decode it.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: resume-screening
type: Opaque
stringData:
  POSTGRES_USER: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"
  JWT_SECRET_KEY: "REPLACE_ME"
  OPENAI_API_KEY: "REPLACE_ME"
  ANTHROPIC_API_KEY: ""
  GITHUB_TOKEN: ""
